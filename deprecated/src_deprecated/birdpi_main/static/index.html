<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BirdPi Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-black min-h-screen flex flex-col items-center p-4 space-y-6">
  <div class="w-full max-w-6xl flex flex-col md:flex-row gap-8">
    <!-- Left: Song List -->
    <div class="flex-1">
      <h1 class="text-3xl font-bold mb-4">Select a Song</h1>
      <ul id="song-list" class="bg-white shadow-md rounded p-2 space-y-1">
        <!-- Songs populated here -->
      </ul>
      <button id="cancel-btn"
              class="mt-4 bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded w-full shadow"
              onclick="cancelSong()">
        ⏹ Cancel Current Song
      </button>
    </div>
  <!-- Right: Birds Table, QR, and WiFi Provisioning -->
  <div class="flex-1 flex flex-col items-center space-y-4">
      <div class="w-full">
        <h2 class="text-2xl font-bold mb-2">Bird Status</h2>
        <div class="overflow-x-auto">
          <table class="min-w-full bg-white rounded shadow text-sm">
            <thead class="bg-gray-200">
              <tr>
                <th class="p-2 text-left">Name</th>
                <th class="p-2 text-left">ID</th>
                <th class="p-2 text-left">IP</th>
                <th class="p-2 text-left">Status</th>
                <th class="p-2 text-left">Last Seen (s ago)</th>
              </tr>
            </thead>
            <tbody id="birds-table">
              <!-- Bird rows populated here -->
            </tbody>
          </table>
        </div>
      </div>
      <div class="text-center">
        <h3 class="text-lg font-semibold mb-1">Scan to Open on Your Phone</h3>
        <img src="birds_qr.png" alt="Scan this QR code" class="w-40 h-40 border rounded mx-auto" />
      </div>
      <!-- WiFi Provisioning Panel -->
      <div class="w-full bg-white rounded shadow p-4 space-y-3">
        <h2 class="text-xl font-bold">WiFi Provisioning</h2>
        <div id="wifi-status" class="text-sm text-gray-700">Loading WiFi status...</div>
        <form id="wifi-form" class="space-y-2" onsubmit="submitWifi(event)">
          <div>
            <label class="block text-sm font-medium mb-1" for="ssid">SSID</label>
            <input id="ssid" name="ssid" type="text" required class="w-full border rounded px-2 py-1" placeholder="Network Name" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1" for="password">Password</label>
            <input id="password" name="password" type="password" required class="w-full border rounded px-2 py-1" placeholder="WiFi Password" />
          </div>
          <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-semibold px-4 py-2 rounded shadow">Save & Apply</button>
          <div id="wifi-feedback" class="text-sm mt-2"></div>
        </form>
      </div>
    </div>
  </div>
  <div id="queue-status" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-white border rounded shadow px-4 py-2 text-gray-800 hidden"></div>
  <script>
    // Song List
    async function fetchSongs() {
      const res = await fetch("/api/songs");
      const songs = await res.json();
      const list = document.getElementById("song-list");
      list.innerHTML = '';
      songs.forEach(song => {
        const li = document.createElement("li");
        li.className = "p-2 flex justify-between items-center hover:bg-gray-100 cursor-pointer rounded";
        li.innerHTML = `
          <span>${song.index + 1}) ${song.name}</span>
          <div class="flex gap-2">
            <button class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-700"
                    title="Play Now"
                    onclick="selectSong(${song.index}, false);event.stopPropagation();">
              ▶️
            </button>
          </div>
        `;
        list.appendChild(li);
      });
    }

    // Birds Table
    async function fetchBirds() {
      const res = await fetch("/api/birds");
      const birds = await res.json();
      const tbody = document.getElementById("birds-table");
      tbody.innerHTML = '';
      Object.entries(birds).forEach(([name, data]) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="p-2 font-semibold">${name}</td>
          <td class="p-2">${data.id ?? ''}</td>
          <td class="p-2">${data.ip ?? ''}</td>
          <td class="p-2 capitalize ${getStatusColor(data.status)}">${data.status ?? ''}</td>
          <td class="p-2">
            ${data.last_seen !== undefined ? (Date.now() / 1000 - Number(data.last_seen)).toFixed(1) : ''}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }
    function getStatusColor(status) {
      if (!status) return '';
      switch (status.toLowerCase()) {
        case "online": return "text-green-600 font-bold";
        case "playing": return "text-blue-600 font-bold";
        case "offline": return "text-gray-400 italic";
        default: return "";
      }
    }

    // Song Selection / Queue
    async function selectSong(index) {
      const btnText = queue ? "Queued" : "Selected";
      showQueueStatus(`${btnText} song #${index+1}...`);
      await fetch("/api/select", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ index })
      });
      setTimeout(hideQueueStatus, 1500);
      fetchSongs(); // Optionally refresh song list if queue updates
    }

    // Cancel Button
    async function cancelSong() {
      showQueueStatus("Cancelling...");
      await fetch("/api/cancel", { method: "POST" });
      setTimeout(hideQueueStatus, 1000);
      fetchSongs();
    }

    // Status Toast
    function showQueueStatus(msg) {
      const s = document.getElementById("queue-status");
      s.innerText = msg;
      s.classList.remove("hidden");
    }
    function hideQueueStatus() {
      document.getElementById("queue-status").classList.add("hidden");
    }

    // WiFi Provisioning
    async function fetchWifiStatus() {
      try {
        const res = await fetch('/api/wifi/status');
        if (!res.ok) throw new Error('status fetch failed');
        const data = await res.json();
        const el = document.getElementById('wifi-status');
        el.innerHTML = `Configured SSID: <strong>${data.configured_ssid}</strong><br/>Connected SSID: <strong>${data.connected_ssid}</strong><br/>IP: <strong>${data.ip}</strong>`;
      } catch (e) {
        document.getElementById('wifi-status').innerText = 'Failed to load WiFi status';
      }
    }

    async function submitWifi(e) {
      e.preventDefault();
      const ssid = document.getElementById('ssid').value.trim();
      const password = document.getElementById('password').value;
      const feedback = document.getElementById('wifi-feedback');
      feedback.className = 'text-sm';
      feedback.innerText = 'Applying...';
      try {
        const res = await fetch('/api/wifi/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ssid, password })
        });
        const data = await res.json();
        if (res.ok && data.status === 'ok') {
          feedback.className = 'text-sm text-green-600';
          feedback.innerText = 'Credentials saved. System may reconnect shortly.';
          fetchWifiStatus();
        } else {
          feedback.className = 'text-sm text-red-600';
          feedback.innerText = data.message || 'Error applying credentials';
        }
      } catch (err) {
        feedback.className = 'text-sm text-red-600';
        feedback.innerText = 'Network error applying credentials';
      }
    }

    // Periodic Refresh
    setInterval(fetchSongs, 5000);
    setInterval(fetchBirds, 2000);
    setInterval(fetchWifiStatus, 7000);
    fetchSongs();
    fetchBirds();
    fetchWifiStatus();
  </script>
</body>
</html>
